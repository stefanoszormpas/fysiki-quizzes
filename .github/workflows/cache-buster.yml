name: Cache Buster

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.html'

permissions:
  contents: write

jobs:
  bust-cache:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add cache buster version strings
      run: |
        TIMESTAMP=$(date +%s)
        echo "TIMESTAMP=${TIMESTAMP}" >> "$GITHUB_ENV"
        for f in style.css quiz.js results.js; do
          find . -name "*.html" -exec sed -i -E "s#assets/${f//./\\.}(\?v=[0-9]+)?#assets/${f}?v=${TIMESTAMP}#g" {} +
        done

    - name: Commit changes
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add .
        git commit -m "Apply cache buster version ${TIMESTAMP}" || echo "No changes to commit"
        git push
